<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Preferences</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Navbar with Sign Out button -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <button class="btn btn-danger" id="signOutBtn">Sign Out</button>
        </div>
    </nav>

    <div class="container mt-5">
        <h1 class="text-center">Set Your Preferences</h1>
        <form id="preferencesForm" class="mt-5">
            <div class="mb-3">
                <label for="healthGoal" class="form-label">What’s your primary health goal?</label>
                <select class="form-select" id="healthGoal" required>
                    <option value="">Select an option</option>
                    <option value="Stay Healthy">Stay Healthy</option>
                    <option value="Gain Weight">Gain Weight</option>
                    <option value="Lose Weight">Lose Weight</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="dietaryPreference" class="form-label">What’s your dietary preference?</label>
                <select class="form-select" id="dietaryPreference" required>
                    <option value="">Select an option</option>
                    <option value="Vegetarian">Vegetarian</option>
                    <option value="Non-Vegetarian">Non-Vegetarian</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="weeklyBudget" class="form-label">Weekly Budget</label>
                <input type="number" class="form-control" id="weeklyBudget" required>
            </div>
            <div class="mb-3">
                <label for="age" class="form-label">Age</label>
                <input type="number" class="form-control" id="age" required>
            </div>
            <div class="mb-3">
                <label for="weight" class="form-label">Weight</label>
                <input type="number" class="form-control" id="weight" required>
            </div>
            <div class="mb-3">
                <label for="height" class="form-label">Height</label>
                <input type="number" class="form-control" id="height" required>
            </div>
            <button type="submit" class="btn btn-primary">Save Preferences</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Sign out button functionality
        document.getElementById('signOutBtn').addEventListener('click', () => {
            localStorage.removeItem('token');  // Remove token from local storage
            window.location.href = 'login.html';  // Redirect to login page
        });

        // Form submission for preferences
        document.getElementById('preferencesForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const healthGoal = document.getElementById('healthGoal').value;
            const dietaryPreference = document.getElementById('dietaryPreference').value;
            const weeklyBudget = document.getElementById('weeklyBudget').value;
            const age = document.getElementById('age').value;
            const weight = document.getElementById('weight').value;
            const height = document.getElementById('height').value;

            const token = localStorage.getItem('token');  // Get token from local storage

            try {
                // Send preferences to the backend
                const response = await fetch('http://localhost:3000/api/preferences', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`  // Add token in Authorization header
                    },
                    body: JSON.stringify({ healthGoal, dietaryPreference, weeklyBudget, age, weight, height })
                });

                if (response.status === 401) {  // If token is invalid or expired
                    alert('Your session has expired. Please log in again.');
                    localStorage.removeItem('token');  // Remove expired token from local storage
                    window.location.href = 'login.html';  // Redirect to login page
                    return;
                }

                if (response.ok) {
                    alert("Preferences saved successfully!");
                    window.location.href = 'index.html';  // Redirect to main page
                } else {
                    alert('Failed to save preferences');
                }
            } catch (error) {
                console.error('Error saving preferences:', error);
                alert('Something went wrong while saving preferences');
            }
        });
    </script>
</body>
</html>
