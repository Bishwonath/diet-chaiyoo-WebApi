<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .delivered-main { padding: 20px; }
    .navbar { background-color: #f8f9fa; }
    .navbar-brand img { height: 50px; }
    .food-delivered img { height: 100px; }
  </style>
</head>
<body>
  <section class="delivered-main">
    <div class="container">
      <!-- Header and Navigation -->
      <nav class="navbar navbar-light navbar-expand-xl">
        <a href="/" class="navbar-brand">
          <img src="logo.png" alt="Logo" class="img-fluid">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navCollapse" aria-controls="navCollapse" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navCollapse">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a href="login.html" class="nav-link">Login</a>
            </li>
            <li class="nav-item">
              <a href="register.html" class="nav-link">Sign Up</a>
            </li>
          </ul>
        </div>
      </nav>

      <!-- Main Content -->
      <div class="row">
        <div class="col-md-6 col-xl-6 col-12">
          <h1>Your Progress</h1>
          <div id="userPreferences" class="mb-4">
            <h3>User Preferences</h3>
            <p><strong>Health Goal:</strong> <span id="healthGoal">Loading...</span></p>
            <p><strong>Dietary Preference:</strong> <span id="dietaryPreference">Loading...</span></p>
            <p><strong>Weekly Budget:</strong> $<span id="weeklyBudget">Loading...</span></p>
            <p><strong>Age:</strong> <span id="age">Loading...</span></p>
            <p><strong>Weight:</strong> <span id="weight">Loading...</span> kg</p>
            <p><strong>Height:</strong> <span id="height">Loading...</span> cm</p>
          </div>
          <div>
            <h4>Update Weekly Budget</h4>
            <label for="budgetSlider">Weekly Budget: ₹</label>
            <input type="range" id="budgetSlider" min="200" max="2000" step="100" value="200">
            <span id="budgetValue">200</span> Rs
            <button class="btn btn-primary" id="updateBudgetBtn">Update Budget</button>
          </div>

          <div class="row food-delivered">
            <div class="col-xl-6 col-6">
              <a href="#" class="text-center d-block">
                <img src="food-delivery.png" alt="Get Food Delivered" class="img-fluid mb-2">
                <h2>Get Food Recommendation</h2>
              </a>
            </div>
            <div class="col-xl-6 col-6">
              <a href="#" class="text-center d-block">
                <img src="grocery-delivery.png" alt="Get Grocery Delivered" class="img-fluid mb-2">
                <h2>Go to Diet Community</h2>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
   document.addEventListener("DOMContentLoaded", async function () {
  const token = localStorage.getItem('token');
  if (!token) {
    console.error("No token found. Redirecting to login.");
    window.location.href = 'login.html'; // Redirect to login if no token
    return;
  }

  try {
    const response = await fetch('http://localhost:3000/api/preferences', {
      method: 'GET',
      headers: {
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json'
      }
    });

    if (!response.ok) {
      console.error("Error fetching preferences. Status:", response.status);
      throw new Error(`Failed to fetch preferences: ${response.statusText}`);
    }

    const data = await response.json();
    console.log("Received data:", data); // Debugging log

    if (!data) {
      throw new Error("No data received from the server.");
    }

    // Populate the user preferences section
    document.getElementById("healthGoal").textContent = data.healthGoal || "N/A";
    document.getElementById("dietaryPreference").textContent = data.dietaryPreference || "N/A";
    document.getElementById("weeklyBudget").textContent = data.weeklyBudget || "N/A";
    document.getElementById("age").textContent = data.age || "N/A";
    document.getElementById("weight").textContent = data.weight || "N/A";
    document.getElementById("height").textContent = data.height || "N/A";

    // Initialize the slider with the current weekly budget value
    const budgetSlider = document.getElementById('budgetSlider');
    const budgetValue = document.getElementById('budgetValue');
    budgetSlider.value = data.weeklyBudget || 200; // Default to 200 if no value found
    budgetValue.textContent = budgetSlider.value; // Show initial value

    // Update displayed value when slider is moved
    budgetSlider.addEventListener('input', function () {
      budgetValue.textContent = budgetSlider.value + ' Rs'; // Update displayed value
    });

    // Handle the budget update
    document.getElementById('updateBudgetBtn').addEventListener('click', async () => {
      const updatedBudget = budgetSlider.value;

      // Update the budget in the database
      const updateResponse = await fetch('http://localhost:3000/api/preferences', {
        method: 'PUT',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ weeklyBudget: parseInt(updatedBudget, 10) }), // Ensure it's a number
      });

      if (updateResponse.ok) {
        alert("Budget updated successfully!");
      } else {
        const errorData = await updateResponse.json();
        console.error("Error response:", errorData); // Log the error response
        alert("Failed to update budget.");
      }
    });

  } catch (error) {
    console.error("Error loading preferences:", error);
    alert('Something went wrong while loading preferences.');
  }
});

  </script>
</body>
</html>
