<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
    <!-- Header Section -->
    <header class="flex justify-between items-center bg-white p-6 shadow-md w-full">
        <img src="images/logo.png" alt="Logo" class="h-16">
    </header>

    <!-- Main Content Section -->
    <main class="flex-grow flex items-center justify-center">
        <div class="flex max-w-4xl w-full">
            <!-- Login Form -->
            <form id="loginForm" class="bg-white p-6 shadow-md rounded-md w-1/2">
                <h1 class="text-center text-3xl font-bold mb-4">Login</h1>
                <div class="mb-4">
                    <label for="loginUsername" class="block text-xl font-bold mb-2">Username</label>
                    <input type="text" id="loginUsername" class="w-full p-2 border rounded-md" required>
                </div>
                <div class="mb-4">
                    <label for="loginPassword" class="block text-xl font-bold mb-2">Password</label>
                    <input type="password" id="loginPassword" class="w-full p-2 border rounded-md" required>
                </div>
                <button type="submit" class="bg-[#B6A28E] text-white p-2 rounded-md w-full">Login</button>
                <p class="mt-3 text-center">Don't have an account? <a href="register.html" class="text-blue-500 underline">Sign Up</a></p>
            </form>

            <!-- Image Container -->
            <div class="w-1/2">
                <img src="images/onboarding1.png" alt="Onboarding" class="w-full h-full object-cover rounded-md">
            </div>
        </div>
    </main>

    <!-- Footer Section -->
    <footer class="bg-[#E07B39] text-white p-4 mt-auto">
        <div class="flex flex-wrap justify-between items-center">
            <div class="w-full md:w-1/3 mb-4 md:mb-0">
                <p class="text-lg font-bold">About Us</p>
                <p>We provide the best food and grocery delivery services tailored to your preferences.</p>
            </div>
            <div class="w-full md:w-1/3 mb-4 md:mb-0">
                <p class="text-lg font-bold">Useful Links</p>
                <ul>
                    <li><a href="https://www.healthline.com/nutrition" class="text-white underline">Healthline Nutrition</a></li>
                    <li><a href="https://www.eatright.org" class="text-white underline">Eat Right</a></li>
                    <li><a href="https://www.nutrition.gov" class="text-white underline">Nutrition.gov</a></li>
                </ul>
            </div>
        </div>
    </footer>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            if (response.ok) {
                const data = await response.json();
                localStorage.setItem('token', data.token);
                if (data.isFirstTime) {
                    window.location.href = 'setPreferences.html'; // Redirect to preferences page
                } else {
                    window.location.href = 'index.html'; // Redirect to home page
                }
            } else {
                alert('Login failed');
            }
        });
    </script>
</body>
</html>
